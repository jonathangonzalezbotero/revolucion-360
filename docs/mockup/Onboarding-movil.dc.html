<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Onboarding · móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141612}a:hover{color:#1E5A3F}
</style>
<style>/*ds*/
body{margin:0;background:#F6F5F0;-webkit-font-smoothing:antialiased}
a{color:#141612;text-decoration-color:#F2CD00;text-decoration-thickness:2px;text-underline-offset:3px}
strong,b{font-weight:600}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h1{font-family:Newsreader,Georgia,serif!important;font-weight:500!important;letter-spacing:-0.015em!important}
.big{font-family:Newsreader,Georgia,serif!important;font-weight:500!important;letter-spacing:-0.02em!important}
input:focus,select:focus,textarea:focus{outline:none;border-color:#141612!important;box-shadow:0 0 0 3px rgba(242,205,0,.45)}
button,a{transition:transform .12s ease,background-color .15s ease,color .15s ease}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid #141612;outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
main>*,.mb>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
main>*:nth-child(2),.mb>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3),.mb>*:nth-child(3){animation-delay:.08s}main>*:nth-child(4),.mb>*:nth-child(4){animation-delay:.12s}main>*:nth-child(n+5),.mb>*:nth-child(n+5){animation-delay:.16s}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
[role=status]{animation:pop .35s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; min-height: 900px; box-sizing: border-box; background: #F6F5F0; font-family: Geist, system-ui, sans-serif; color: #141612; display: flex; flex-direction: column">
  <header style="background: radial-gradient(120% 150% at 100% 100%, rgba(242,205,0,.20) 0%, rgba(242,205,0,0) 55%), linear-gradient(135deg, #0B0C0A 0%, #1C1E19 100%); color: #FFFFFF; border-radius: 0 0 32px 32px; padding: 22px 22px 26px; display: flex; flex-direction: column; gap: 18px; position: relative; overflow: hidden">
    <div aria-hidden="true" style="position: absolute; right: -70px; top: -70px; width: 200px; height: 200px; border-radius: 50%; border: 34px solid #23251F"></div>
    <div style="display: flex; justify-content: space-between; align-items: center; position: relative">
      <div style="display: flex; align-items: center; gap: 8px">
        <div aria-hidden="true" style="width: 28px; height: 28px; border-radius: 9px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><div style="width: 10px; height: 10px; border-radius: 50%; border: 2.5px solid #141612"></div></div>
        <span style="font-weight: 600; font-size: 16px">Revolución 360</span>
      </div>
      <span style="font-size: 12px; font-weight: 600; color: #CFCCC2">{{ stepText }}</span>
    </div>
    <ol aria-label="Pasos" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 5px; position: relative">
      <sc-for list="{{ dots }}" as="d" hint-placeholder-count="5"><li style="flex: {{ d.flex }}; height: 5px; border-radius: 3px; background: {{ d.c }}"></li></sc-for>
    </ol>
    <div style="display: flex; flex-direction: column; gap: 8px; position: relative">
      <h1 style="margin: 0; font-size: 27px; line-height: 1.15; font-weight: 600; letter-spacing: -0.03em">{{ side.title }}</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #D9D6CC">{{ side.text }}</p>
    </div>
  </header>

  <div style="flex: 1; padding: 22px 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <sc-if value="{{ s0 }}" hint-placeholder-val="{{ true }}">
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{ perks }}" as="p" hint-placeholder-count="3">
          <li style="display: flex; gap: 12px; align-items: center; background: #FFFFFF; border-radius: 16px; padding: 14px; border: 1px solid #E6E4DC">
            <span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 12px; background: {{ p.bg }}; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{ p.fg }}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></span>
            <span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 14px; font-weight: 600">{{ p.t }}</strong><span style="font-size: 12px; color: #5F6359">{{ p.d }}</span></span>
          </li>
        </sc-for>
      </ul>
    </sc-if>

    <sc-if value="{{ s1 }}" hint-placeholder-val="{{ false }}">
      <div role="group" aria-label="Metas" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{ goals }}" as="g" hint-placeholder-count="6">
          <button type="button" role="checkbox" aria-checked="{{ g.checked }}" onClick="{{ g.toggle }}" style="font: inherit; text-align: left; min-height: 92px; padding: 12px; border-radius: 16px; border: 2px solid {{ g.border }}; background: {{ g.bg }}; color: #141612; display: flex; flex-direction: column; justify-content: space-between; gap: 8px">
            <span style="display: flex; justify-content: space-between; width: 100%">
              <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 10px; background: {{ g.iconBg }}; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: {{ g.shape }}; background: {{ g.iconFg }}"></span></span>
              <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid {{ g.tickBorder }}; background: {{ g.tickBg }}; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{ g.tick }}</span>
            </span>
            <span style="font-size: 13px; font-weight: 600; line-height: 1.3">{{ g.name }}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ s2 }}" hint-placeholder-val="{{ false }}">
      <form style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="mo-n" style="font-size: 14px; font-weight: 600">¿Cómo te llamas?</label><input id="mo-n" type="text" autocomplete="given-name" value="{{ name }}" onChange="{{ setName }}" style="font: inherit; font-size: 16px; height: 52px; padding: 0 14px; border: 1.5px solid #D9D6CC; border-radius: 14px; background: #FFFFFF"></div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
            <div style="display: flex; flex-direction: column; gap: 7px"><label for="mo-pais" style="font-size: 14px; font-weight: 600">¿Dónde vives?</label><select id="mo-pais" style="font: inherit; font-size: 15px; height: 52px; padding: 0 10px; border: 1.5px solid #D9D6CC; border-radius: 14px; background: #FFFFFF"><option>Australia</option><option>Colombia</option><option>México</option><option>España</option><option>Estados Unidos</option><option>Otro país</option></select></div>
            <div style="display: flex; flex-direction: column; gap: 7px"><label for="mo-mon" style="font-size: 14px; font-weight: 600">Moneda</label><select id="mo-mon" style="font: inherit; font-size: 15px; height: 52px; padding: 0 10px; border: 1.5px solid #D9D6CC; border-radius: 14px; background: #FFFFFF"><option>AUD · dólar australiano</option><option>COP · peso colombiano</option><option>MXN · peso mexicano</option><option>EUR · euro</option><option>USD · dólar</option></select></div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px"><label for="mo-e" style="font-size: 14px; font-weight: 600">Correo</label><input id="mo-e" type="email" autocomplete="email" style="font: inherit; font-size: 16px; height: 52px; padding: 0 14px; border: 1.5px solid #D9D6CC; border-radius: 14px; background: #FFFFFF"></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="mo-p" style="font-size: 14px; font-weight: 600">Contraseña</label><input id="mo-p" type="password" autocomplete="new-password" style="font: inherit; font-size: 16px; height: 52px; padding: 0 14px; border: 1.5px solid #D9D6CC; border-radius: 14px; background: #FFFFFF"><span style="font-size: 12px; color: #5F6359">Mínimo 12 caracteres.</span></div>
      </form>
    </sc-if>

    <sc-if value="{{ s3 }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 14px; align-items: stretch">
        <div role="img" aria-label="Código QR" style="align-self: center; width: 150px; height: 150px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #5F6359; font-weight: 600; border: 1px solid #E6E4DC">[CÓDIGO QR]</div>
        <label for="mo-c" style="font-size: 14px; font-weight: 600">Código de 6 dígitos</label>
        <input id="mo-c" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="font: inherit; font-size: 26px; font-weight: 600; letter-spacing: .35em; text-align: center; height: 58px; border: 1.5px solid #D9D6CC; border-radius: 14px; background: #FFFFFF">
      </div>
    </sc-if>

    <sc-if value="{{ s4 }}" hint-placeholder-val="{{ false }}">
      <div role="group" aria-label="Categorías" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{ cats }}" as="c" hint-placeholder-count="9">
          <button type="button" role="checkbox" aria-checked="{{ c.checked }}" onClick="{{ c.toggle }}" style="font: inherit; font-size: 14px; font-weight: 600; min-height: 46px; padding: 0 14px 0 8px; border-radius: 999px; border: 2px solid {{ c.border }}; background: {{ c.bg }}; color: #141612; display: flex; align-items: center; gap: 8px; opacity: {{ c.op }}"><span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 50%; background: {{ c.color }}"></span>{{ c.name }}</button>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ s5 }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div aria-hidden="true" style="width: 150px; height: 150px; border-radius: 40px; background: #F5F1ED; box-shadow: 0 12px 30px rgba(20,22,18,.12); align-self: center; overflow: hidden; flex: none"><img src="/_blob/f9f5721b8c6aeebaad5de3901da91941" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></div>
        <h2 style="margin: 0; font-size: 22px; font-weight: 600">{{ doneTitle }}</h2>
        <sc-for list="{{ chosen }}" as="g" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 14px; padding: 12px 14px; border: 1px solid #E6E4DC">
            <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 10px; background: {{ g.iconBg }}; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: {{ g.shape }}; background: {{ g.iconFg }}"></span></span>
            <span style="font-size: 14px; font-weight: 600">{{ g.name }}</span>
          </div>
        </sc-for>
        <a href="PlanGuiado-movil.dc.html" style="text-decoration: none; text-align: center; font-size: 15px; font-weight: 600; padding: 17px; background: #141612; color: #FFFFFF; border-radius: 14px; margin-top: 6px">Armar mi plan · 3 min</a>
        <a href="Plan-movil.dc.html" style="text-align: center; font-size: 14px; font-weight: 600; padding: 12px">Empezar en blanco</a>
      </div>
    </sc-if>

    <div style="margin-top: auto; display: flex; gap: 10px; visibility: {{ navVis }}">
      <button type="button" onClick="{{ back }}" aria-label="Atrás" style="font: inherit; width: 54px; height: 54px; border: 0; background: #FFFFFF; color: #3A3D36; border-radius: 14px; font-size: 18px; visibility: {{ backVis }}">‹</button>
      <button type="button" onClick="{{ next }}" style="font: inherit; flex: 1; font-size: 16px; font-weight: 600; height: 54px; border: 0; background: #141612; color: #FFFFFF; border-radius: 14px; box-shadow: 0 8px 20px rgba(14,90,77,.25)">{{ nextLabel }}</button>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px"><img src="/_blob/07130166ac57906f8a4d3175882f16f6" alt="Revolución del Dinero" style="width: 30px; height: 30px"><span style="font-size: 11px; color: #5F6359">Una herramienta de Revolución del Dinero</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0, goals: { deudas: true, viaje: true }, off: {}, name: '' };
  }
  renderVals() {
    const s = this.state, st = s.step;
    const G = [
      ['deudas', 'Salir de deudas', '#FBEBD8', '#C46A2A', '4px'],
      ['viaje', 'Ahorrar para un viaje', '#FDF1DE', '#E3B800', '50%'],
      ['emergencia', 'Fondo de emergencia', '#E3ECF6', '#4C7FB5', '4px 4px 50% 50%'],
      ['claridad', 'Saber a dónde va mi dinero', '#E3F1E8', '#141612', '50%'],
      ['invertir', 'Empezar a invertir', '#E5F1ED', '#3E8C7A', '2px'],
      ['negocio', 'Separar mi dinero del negocio', '#E3ECF6', '#2D5C8A', '50% 4px']
    ];
    const goals = G.map(([id, name, iconBg, iconFg, shape]) => {
      const on = !!s.goals[id];
      return { name, iconBg, iconFg, shape, checked: String(on), border: on ? '#141612' : '#E6E4DC', bg: on ? '#FFF8D6' : '#FFFFFF', tick: on ? '✓' : '', tickBorder: on ? '#141612' : '#CFCCC2', tickBg: on ? '#141612' : '#FFFFFF', toggle: () => this.setState({ goals: Object.assign({}, s.goals, { [id]: !on }) }) };
    });
    const C = [['Ingresos', '#141612'], ['Hogar y básicos', '#141612'], ['Vehículo', '#6FA898'], ['Comida y ocio', '#A8D3C3'], ['Deudas', '#C46A2A'], ['Ahorro', '#4C7FB5'], ['Metas', '#E3B800'], ['Estilo de vida', '#3E8C7A'], ['Mi negocio', '#2D5C8A']];
    const cats = C.map(([name, color]) => {
      const on = !s.off[name];
      return { name, color, checked: String(on), border: on ? '#141612' : '#E6E4DC', bg: on ? '#FFFFFF' : '#F6F5F0', op: on ? '1' : '0.55', toggle: () => this.setState({ off: Object.assign({}, s.off, { [name]: on }) }) };
    });
    const SIDE = [
      ['Deja de adivinar a dónde se va tu dinero.', 'Planea tu año completo y decide viendo los 12 meses juntos.'],
      ['¿Qué quieres lograr este año?', 'Elige todas las que quieras.'],
      ['Crea tu cuenta', 'Nadie más ve tus números. No pedimos tus claves del banco.'],
      ['Protege tu cuenta', 'La verificación en dos pasos es obligatoria para todos.'],
      ['Tus categorías', 'Una base para empezar. Edítalas cuando quieras.'],
      ['Todo listo', 'Ahora, tu plan del año en 3 minutos.']
    ];
    const perks = [
      { t: 'Plan anual editable', d: 'Ajusta los 12 meses y mira el efecto', bg: '#E3F1E8', fg: '#141612' },
      { t: 'Metas con seguimiento', d: 'Viajes, emergencias, salir de deudas', bg: '#FDF1DE', fg: '#E3B800' },
      { t: 'Metas con fecha', d: 'Cuánto apartar al mes para llegar', bg: '#E3ECF6', fg: '#4C7FB5' }
    ];
    const di = st === 5 ? 4 : st;
    const dots = [0, 1, 2, 3, 4].map((i) => ({ flex: i === di ? '2' : '1', c: i <= di ? '#F2CD00' : '#3A3D36' }));
    const nm = (s.name || '').trim();
    return {
      s0: st === 0, s1: st === 1, s2: st === 2, s3: st === 3, s4: st === 4, s5: st === 5,
      side: { title: SIDE[st][0], text: SIDE[st][1] },
      goals, chosen: goals.filter((g) => g.checked === 'true'), cats, perks, dots,
      stepText: st === 0 ? 'Menos de 3 min' : 'Paso ' + (st === 5 ? 4 : st) + ' de 4',
      name: s.name, setName: (e) => this.setState({ name: e.target.value }),
      doneTitle: nm ? '¡Listo, ' + nm + '!' : '¡Listo!',
      navVis: st === 5 ? 'hidden' : 'visible', backVis: st === 0 ? 'hidden' : 'visible',
      nextLabel: st === 0 ? 'Empezar' : (st === 3 ? 'Crear mi espacio' : 'Continuar'),
      back: () => this.setState({ step: st === 5 ? 3 : Math.max(0, st - 1) }),
      next: () => this.setState({ step: st === 3 ? 5 : Math.min(5, st + 1) })
    };
  }
}
</script>
</body>
</html>
