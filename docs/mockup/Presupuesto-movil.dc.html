<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Presupuesto del mes · móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141612}a:hover{color:#1E5A3F}
.num{font-variant-numeric:tabular-nums}
</style>
<style>/*ds*/
body{margin:0;background:#F6F5F0;-webkit-font-smoothing:antialiased}
a{color:#141612;text-decoration-color:#F2CD00;text-decoration-thickness:2px;text-underline-offset:3px}
strong,b{font-weight:600}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h1{font-family:Newsreader,Georgia,serif!important;font-weight:500!important;letter-spacing:-0.015em!important}
.big{font-family:Newsreader,Georgia,serif!important;font-weight:500!important;letter-spacing:-0.02em!important}
input:focus,select:focus,textarea:focus{outline:none;border-color:#141612!important;box-shadow:0 0 0 3px rgba(242,205,0,.45)}
button,a{transition:transform .12s ease,background-color .15s ease,color .15s ease}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid #141612;outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
main>*,.mb>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
main>*:nth-child(2),.mb>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3),.mb>*:nth-child(3){animation-delay:.08s}main>*:nth-child(4),.mb>*:nth-child(4){animation-delay:.12s}main>*:nth-child(n+5),.mb>*:nth-child(n+5){animation-delay:.16s}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
[role=status]{animation:pop .35s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; min-height: 1700px; box-sizing: border-box; background: #F6F5F0; font-family: Geist, system-ui, sans-serif; color: #141612; display: flex; flex-direction: column">
  <header style="padding: 20px 16px 10px; display: flex; flex-direction: column; gap: 12px">
    <a href="Plan-movil.dc.html" style="text-decoration: none; font-size: 14px; font-weight: 600; padding: 6px 0; align-self: flex-start">‹ Plan anual</a>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Mes anterior" style="font: inherit; width: 44px; height: 44px; border: 0; background: #FFFFFF; border-radius: 12px; color: #3A3D36; font-size: 18px">‹</button>
      <div style="display: flex; flex-direction: column; align-items: center">
        <span style="font-size: 12px; color: #5F6359">Plan vs. real</span>
        <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">Noviembre 2026</h1>
      </div>
      <button type="button" aria-label="Mes siguiente" style="font: inherit; width: 44px; height: 44px; border: 0; background: #FFFFFF; border-radius: 12px; color: #3A3D36; font-size: 18px">›</button>
    </div>
  </header>

  <div style="flex: 1; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <section aria-label="Avance del mes" style="background: transparent; color: #141612; border-top: 2px solid #141612; border-bottom: 1px solid #E6E4DC; border-radius: 0; padding: 20px 0; display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 12px; color: #5F6359">Pagado de $6,323</span>
      <span class="num big" style="font-size: 34px; font-weight: 600; letter-spacing: -0.03em">$4,283</span>
      <div aria-hidden="true" style="height: 8px; border-radius: 4px; background: #E6E4DC"><div style="width: 68%; height: 8px; border-radius: 4px; background: #1F8A5B"></div></div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #5F6359">
        <span>Ingresos <strong class="num" style="color: #141612">$6,418</strong></span>
        <span>Pendiente <strong class="num" style="color: #141612">$2,040</strong></span>
        <span>Te sobra <strong class="num" style="color: #141612">$95</strong></span>
      </div>
    </section>

    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="8">
      <section style="background: #FFFFFF; border-radius: 14px; padding: 4px 16px; border: 1px solid #E6E4DC">
        <h2 style="margin: 0; padding: 12px 0 6px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600">
          <span style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 3px; background: {{ g.color }}"></span>{{ g.name }}</span>
          <span class="num" style="color: #5F6359; font-weight: 600">{{ g.total }}</span>
        </h2>
        <ul style="list-style: none; margin: 0; padding: 0">
          <sc-for list="{{ g.items }}" as="r" hint-placeholder-count="3">
            <li style="display: flex; align-items: center; gap: 10px; min-height: 52px; border-top: 1px solid #EFEDE6">
              <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; background: {{ r.bg }}; color: {{ r.fg }}">{{ r.icon }}</span>
              <span style="flex: 1; font-size: 14px">{{ r.name }}<span style="display: block; font-size: 11px; color: #5F6359">{{ r.status }}</span></span>
              <span class="num" style="font-size: 14px; font-weight: 600">{{ r.plan }}</span>
              <sc-if value="{{ r.canTog }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ r.tog }}" aria-pressed="{{ r.pressed }}" aria-label="{{ r.act }}: {{ r.name }}" style="font: inherit; font-size: 11px; font-weight: 600; min-height: 34px; padding: 0 9px; border-radius: 999px; border: 1.5px dashed #BDB9AD; background: #FFFFFF; color: #141612; cursor: pointer; white-space: nowrap">{{ r.act }}</button></sc-if>
            </li>
          </sc-for>
        </ul>
      </section>
    </sc-for>
  </div>

  <nav aria-label="Principal" style="background: #FBFAF6; border-top: 1px solid #E6E4DC; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 4px 22px"><a href="Inicio-movil.dc.html" style="text-decoration: none; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 11px; font-weight: 450; color: #7A7D73"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A7D73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11h5v-6h4v6h5V9"/></svg>Inicio</a><a href="Plan-movil.dc.html" aria-current="page" style="text-decoration: none; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 11px; font-weight: 600; color: #141612"><span aria-hidden="true" style="position: absolute; top: -8px; width: 22px; height: 3px; border-radius: 0 0 3px 3px; background: #F2CD00"></span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141612" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2.5v3M16 2.5v3M8 13h2M14 13h2M8 17h2"/></svg>Plan</a><a href="Movimientos-movil.dc.html" style="text-decoration: none; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 11px; font-weight: 450; color: #7A7D73"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A7D73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M7 20V4M3 8l4-4 4 4"/><path d="M17 4v16M13 16l4 4 4-4"/></svg>Movimientos</a><a href="Academia-movil.dc.html" style="text-decoration: none; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 11px; font-weight: 450; color: #7A7D73"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A7D73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3.5 2.6 8.5 2.6 12 0v-5"/><path d="M22 9v5"/></svg>Academia</a><a href="Mas-movil.dc.html" style="text-decoration: none; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 11px; font-weight: 450; color: #7A7D73"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A7D73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Más</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { man: {} }; }
  renderVals() {
    const man = this.state.man;
    const fmt = (v) => '$' + v.toLocaleString('en-AU');
    const S = {
      pagado: { status: 'Pagado', bg: '#E3F1E8', fg: '#1E5A3F', icon: '✓' },
      pendiente: { status: 'Pendiente', bg: '#EFEDE6', fg: '#5F6359', icon: '·' },
      sinconc: { status: 'Sin movimiento aún', bg: '#EFEDE6', fg: '#5F6359', icon: '·' },
      manual: { status: 'Pagado · a mano', bg: '#FFF3B8', fg: '#5C4A00', icon: '✓' }
    };
    const defs = [
      ['Ingresos', '#141612', [['Sueldo', 5418, 'sinconc'], ['Retiros de Easy Aussie', 800, 'sinconc'], ['E-bikes', 200, 'sinconc']]],
      ['Hogar y básicos', '#141612', [['Home', 1330, 'pagado'], ['Groceries', 400, 'pagado'], ['Felix Mobile', 40, 'pendiente'], ['Suscripciones', 125, 'pagado'], ['Seguro de salud', 128, 'pagado']]],
      ['Transporte', '#6FA898', [['Car expenses', 180, 'pagado'], ['Bike expenses', 90, 'pagado'], ['Gasolina', 100, 'pagado'], ['Seguro de la moto', 80, 'pagado']]],
      ['Deudas', '#C46A2A', [['Inner Circle', 700, 'pagado'], ['Bike Payment', 100, 'pagado']]],
      ['Comida y ocio', '#A8D3C3', [['Food and Entertainment', 400, 'pagado']]],
      ['Ahorro e inversión', '#4C7FB5', [['S&P500', 150, 'pagado'], ['Emergency fund', 100, 'pagado']]],
      ['Metas', '#E3B800', [['Viaje a Colombia', 2000, 'pendiente']]],
      ['Negocio', '#2D5C8A', [['Aportes a Easy Aussie', 400, 'pagado']]]
    ];
    const groups = defs.map(([name, color, items]) => ({
      name, color, total: fmt(items.reduce((a, i) => a + i[1], 0)),
      items: items.map(([n, v, st0]) => {
        const isMov = st0 === 'pagado', st = isMov ? 'pagado' : (man[n] ? 'manual' : st0);
        return Object.assign({ name: n, plan: fmt(v), canTog: !isMov, isMov, pressed: String(!!man[n]), act: man[n] ? 'Deshacer' : 'Marcar pagado', tog: () => this.setState({ man: Object.assign({}, man, { [n]: !man[n] }) }) }, S[st]);
      })
    }));
    const tabs = [['Resumen','Resumen-movil.dc.html'],['Plan','Plan-movil.dc.html'],['Movimientos','Movimientos-movil.dc.html'],['Forecast','Forecast-movil.dc.html'],['Más','Deudas-movil.dc.html']].map(([label, href]) => {
      const on = href === 'Plan-movil.dc.html';
      return { label, href, current: on ? 'page' : 'false', weight: on ? '600' : '450', fg: on ? '#141612' : '#5F6359', pill: on ? '#E3F1E8' : 'transparent' };
    });
    return { groups, tabs };
  }
}
</script>
</body>
</html>
