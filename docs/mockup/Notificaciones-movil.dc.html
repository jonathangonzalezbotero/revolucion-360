<style>
body{margin:0;background:#F6F5F0;-webkit-font-smoothing:antialiased}
a{color:#141612;text-decoration-color:#F2CD00;text-decoration-thickness:2px;text-underline-offset:3px}a:hover{color:#000}

.big{font-family:Newsreader,Georgia,serif!important;font-weight:500!important;letter-spacing:-0.02em!important;font-variant-numeric:lining-nums tabular-nums}

</style>
<style>/*ds*/

<div style="width: 390px; min-height: 1500px; box-sizing: border-box; background: #F6F5F0; font-family: Geist, system-ui, sans-serif; color: #141612; display: flex; flex-direction: column; position: relative">
  <header style="padding: 24px 20px 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #5F6359">{{ unread }} sin leer</span><h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.03em">Notificaciones</h1></div>
    <button type="button" onClick="{{ allRead }}" style="font: inherit; font-size: 13px; font-weight: 600; color: #141612; border: 0; background: transparent; min-height: 44px; cursor: pointer">Leer todas</button>
  </header>
  <div class="mb" style="flex: 1; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 12px">
<div role="radiogroup" aria-label="Filtrar" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px"><sc-for list="{{ filters }}" as="t" hint-placeholder-count="7"><button type="button" role="radio" aria-checked="{{ t.checked }}" onClick="{{ t.pick }}" style="font: inherit; font-size: 13px; font-weight: 600; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid {{ t.border }}; background: {{ t.bg }}; color: #141612; cursor: pointer; white-space: nowrap">{{ t.name }}</button></sc-for></div>
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2"><section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 8px 4px 2px; font-size: 13px; font-weight: 600; color: #5F6359; text-transform: uppercase; letter-spacing: .06em">{{ g.g }}</h2>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{ g.list }}" as="n" hint-placeholder-count="3"><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px; border-radius: 16px; background: {{ n.rowBg }}; border: 1px solid #E6E4DC">
          <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: {{ n.bg }}; color: {{ n.fg }}; flex: none; display: flex; align-items: center; justify-content: center"><sc-if value="{{ n.isRecordatorios }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2.5v3M16 2.5v3"/><path d="M8.5 15l2.5 2.5 4.5-5"/></svg></sc-if><sc-if value="{{ n.isLogros }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg></sc-if><sc-if value="{{ n.isAlertas }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M6 9a6 6 0 0 1 12 0c0 6.5 2.5 8.5 2.5 8.5h-17S6 15.5 6 9"/><path d="M10 21a2.2 2.2 0 0 0 4 0"/></svg></sc-if><sc-if value="{{ n.isAcademia }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3.5 2.6 8.5 2.6 12 0v-5"/><path d="M22 9v5"/></svg></sc-if><sc-if value="{{ n.isCuenta }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></sc-if></span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <div style="display: flex; justify-content: space-between; gap: 10px"><strong style="font-size: 15px; font-weight: {{ n.weight }}">{{ n.t }}</strong><span style="font-size: 12px; color: #5F6359; white-space: nowrap">{{ n.time }}</span></div>
            <span style="font-size: 14px; color: #3A3D36; line-height: 1.5">{{ n.d }}</span>
            <div style="display: flex; gap: 14px; align-items: center; flex-wrap: wrap"><a href="{{ n.href }}" style="font-size: 14px; font-weight: 600; padding: 6px 0">{{ n.cta }} ›</a>
              <sc-if value="{{ n.unread }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ n.read }}" style="font: inherit; font-size: 13px; font-weight: 600; color: #5F6359; border: 0; background: transparent; cursor: pointer; padding: 6px 0">Marcar como leída</button></sc-if>
              <button type="button" onClick="{{ n.del }}" style="font: inherit; font-size: 13px; font-weight: 600; color: #5F6359; border: 0; background: transparent; cursor: pointer; padding: 6px 0">Quitar</button></div>
          </div>
          <sc-if value="{{ n.unread }}" hint-placeholder-val="{{ true }}"><span aria-label="Sin leer" style="width: 10px; height: 10px; border-radius: 50%; background: #F2CD00; border: 2px solid #141612; flex: none; margin-top: 6px"></span></sc-if>
        </li></sc-for>
      </ul>
    </section></sc-for>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 32px; text-align: center; font-size: 15px; color: #5F6359; background: #FFFFFF; border-radius: 14px; border: 1.5px dashed #D9D6CC">Nada por aquí. Estás al día.</p></sc-if>
    <p style="margin: 0; font-size: 13px; color: #5F6359">Elige qué te llega por correo y qué al celular en <a href="Perfil-movil.dc.html" style="font-weight: 600">Mi perfil › Notificaciones</a>.</p>
  </div>
  <nav aria-label="Principal" style="background: #FBFAF6; border-top: 1px solid #E6E4DC; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 4px 22px"><a href="Inicio-movil.dc.html" aria-current="page" style="text-decoration: none; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 11px; font-weight: 600; color: #141612"><span aria-hidden="true" style="position: absolute; top: -8px; width: 22px; height: 3px; border-radius: 0 0 3px 3px; background: #F2CD00"></span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141612" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11h5v-6h4v6h5V9"/></svg>Inicio</a><a href="Plan-movil.dc.html" style="text-decoration: none; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 11px; font-weight: 450; color: #7A7D73"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A7D73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2.5v3M16 2.5v3M8 13h2M14 13h2M8 17h2"/></svg>Plan</a><a href="Movimientos-movil.dc.html" style="text-decoration: none; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 11px; font-weight: 450; color: #7A7D73"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A7D73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M7 20V4M3 8l4-4 4 4"/><path d="M17 4v16M13 16l4 4 4-4"/></svg>Movimientos</a><a href="Academia-movil.dc.html" style="text-decoration: none; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 11px; font-weight: 450; color: #7A7D73"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A7D73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3.5 2.6 8.5 2.6 12 0v-5"/><path d="M22 9v5"/></svg>Academia</a><a href="Mas-movil.dc.html" style="text-decoration: none; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 11px; font-weight: 450; color: #7A7D73"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A7D73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Más</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 'Todas', items: [
      { id: 1, g: 'Hoy', k: 'Recordatorios', t: 'Cierra noviembre en 5 minutos', d: 'Quedan 6 días. Revisa, compara y ajusta diciembre.', time: '9:00', cta: 'Empezar cierre', href: 'Cierre-movil.dc.html', unread: true },
      { id: 2, g: 'Hoy', k: 'Logros', t: 'Racha de 3 semanas', d: 'Registraste gastos 3 semanas seguidas. +15 puntos.', time: '8:12', cta: 'Ver mis logros', href: 'Perfil-movil.dc.html', unread: true },
      { id: 3, g: 'Hoy', k: 'Recordatorios', t: 'Mañana pagas Inner Circle', d: 'Cuota de $600 desde Ubank Spend. Tienes $2,340.', time: '7:30', cta: 'Ver deuda', href: 'Deudas-movil.dc.html', unread: true },
      { id: 4, g: 'Esta semana', k: 'Alertas', t: 'Comida fuera va en 92%', d: 'Llevas $460 de $500 en noviembre y faltan 6 días.', time: 'Dom', cta: 'Ver detalle', href: 'Presupuesto-movil.dc.html', unread: false },
      { id: 5, g: 'Esta semana', k: 'Academia', t: 'Clase nueva: Tu fondo de emergencia', d: 'Curso 08 · 6 minutos.', time: 'Vie', cta: 'Ver clase', href: 'Leccion-movil.dc.html', unread: false },
      { id: 6, g: 'Esta semana', k: 'Cuenta', t: 'Entraste desde un equipo nuevo', d: 'Chrome en Windows · Sydney. ¿No fuiste tú? Cambia tu contraseña.', time: 'Jue', cta: 'Revisar seguridad', href: 'Perfil-movil.dc.html', unread: false },
      { id: 7, g: 'Antes', k: 'Cuenta', t: 'Tu acceso fundador vence el 1 de marzo', d: 'Te avisamos 30 y 7 días antes. Tus datos no se pierden.', time: '15 nov', cta: 'Ver suscripción', href: 'Suscripcion-movil.dc.html', unread: false }
    ] };
  }
  renderVals() {
    const s = this.state;
    const K = { 'Recordatorios': ['#FDF1DE', '#B26A12'], 'Logros': ['#FFF6CC', '#B38F00'], 'Alertas': ['#FCEDE6', '#C2410C'], 'Academia': ['#E3F1E8', '#141612'], 'Cuenta': ['#E3ECF6', '#2D5C8A'] };
    const F = ['Todas', 'Sin leer', 'Recordatorios', 'Alertas', 'Logros', 'Academia', 'Cuenta'];
    const filters = F.map((k) => ({ name: k, checked: String(s.f === k), border: s.f === k ? '#141612' : '#E6E4DC', bg: s.f === k ? '#FFF8D6' : '#FFFFFF', pick: () => this.setState({ f: k }) }));
    const vis = s.items.filter((n) => s.f === 'Todas' || (s.f === 'Sin leer' ? n.unread : n.k === s.f));
    const groups = ['Hoy', 'Esta semana', 'Antes'].map((g) => ({ g, list: vis.filter((n) => n.g === g).map((n) => ({
      t: n.t, d: n.d, time: n.time, isRecordatorios: n.k === 'Recordatorios', isLogros: n.k === 'Logros', isAlertas: n.k === 'Alertas', isAcademia: n.k === 'Academia', isCuenta: n.k === 'Cuenta', cta: n.cta, href: n.href, k: n.k, bg: K[n.k][0], fg: K[n.k][1], unread: n.unread,
      weight: n.unread ? '800' : '600', rowBg: n.unread ? '#FFFFFF' : 'transparent',
      read: () => this.setState({ items: s.items.map((x) => x.id === n.id ? Object.assign({}, x, { unread: false }) : x) }),
      del: () => this.setState({ items: s.items.filter((x) => x.id !== n.id) })
    })) })).filter((g) => g.list.length > 0);
    const un = s.items.filter((n) => n.unread).length;
    return { filters, groups, unread: String(un), hasUnread: un > 0, empty: groups.length === 0, allRead: () => this.setState({ items: s.items.map((x) => Object.assign({}, x, { unread: false })) }) };
  }
}
</script>
